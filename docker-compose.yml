services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama_service
    ports:
      - "11434:11434"
    volumes:
      - ./ollama_data:/root/.ollama
    restart: always

  agent:
    build: .
    container_name: terminal_agent
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      - ./memory:/app/memory
      - ./workspace:/app/workspace
      - /proc:/host_proc:ro
    stdin_open: true
    tty: true
