services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama_service
    ports:
      - "11434:11434"
    volumes:
      - ./ollama_data:/root/.ollama
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    environment:
      - OLLAMA_CONTEXT_LENGTH=16384
      - OLLAMA_VULKAN=1
      - OLLAMA_IGPU_ENABLE=1
    restart: always

  agent:
    build: .
    container_name: terminal_agent
    depends_on:
      - ollama
    pid: "host"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - TZ=America/Toronto
    volumes:
      - ./memory:/app/memory
      - ./workspace:/app/workspace
      - /proc:/host_proc:ro
      - /var/run/docker.sock:/var/run/docker.sock
    stdin_open: true
    tty: true
